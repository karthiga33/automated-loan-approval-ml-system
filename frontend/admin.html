<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanSmart AI - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f8fafc; color:#1e293b; }
        .navbar { background:#0f172a; padding:16px 40px; display:flex; justify-content:space-between; align-items:center; }
        .logo { display:flex; align-items:center; gap:10px; }
        .logo-icon { width:40px; height:40px; background:linear-gradient(135deg,#1a56db,#0ea5e9); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-size:18px; }
        .logo-text { font-size:20px; font-weight:700; color:white; } .logo-text span { color:#60a5fa; }
        .nav-links a { color:#94a3b8; text-decoration:none; font-size:14px; font-weight:500; padding:8px 16px; border-radius:8px; margin-left:8px; }
        .nav-links a:hover { background:rgba(255,255,255,0.1); color:white; }
        .nav-links a.active { background:#1a56db; color:white; }
        .container { max-width:1200px; margin:32px auto; padding:0 20px; }
        .page-header { margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; }
        .page-header h1 { font-size:24px; font-weight:800; }
        .page-header .refresh-btn { padding:10px 20px; background:white; border:1px solid #e2e8f0; border-radius:8px; cursor:pointer; font-size:13px; font-weight:500; font-family:inherit; }

        .kpi-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin-bottom:28px; }
        .kpi { background:white; border-radius:12px; padding:20px; border:1px solid #e2e8f0; }
        .kpi .label { font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
        .kpi .value { font-size:28px; font-weight:800; }
        .kpi.blue .value { color:#1a56db; }
        .kpi.green .value { color:#059669; }
        .kpi.red .value { color:#dc2626; }
        .kpi.orange .value { color:#d97706; }
        .kpi.purple .value { color:#7c3aed; }

        .section { background:white; border-radius:12px; padding:24px; border:1px solid #e2e8f0; margin-bottom:20px; }
        .section h3 { font-size:14px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        .section h3 i { color:#1a56db; }

        table { width:100%; border-collapse:collapse; }
        th { text-align:left; font-size:11px; text-transform:uppercase; color:#64748b; padding:12px; border-bottom:2px solid #e2e8f0; }
        td { padding:12px; border-bottom:1px solid #f1f5f9; font-size:13px; }
        tr:hover { background:#f8fafc; }
        .badge { display:inline-block; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:700; }
        .badge.approved { background:#d1fae5; color:#065f46; }
        .badge.rejected { background:#fee2e2; color:#991b1b; }
        .badge.review { background:#fef3c7; color:#92400e; }
        .badge.active { background:#dbeafe; color:#1e40af; }
        .badge.closed { background:#f1f5f9; color:#475569; }

        @media (max-width:768px) { .kpi-grid { grid-template-columns:1fr 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-shield-halved"></i></div>
            <div class="logo-text">Loan<span>Smart</span> AI — Admin</div>
        </div>
        <div class="nav-links">
            <a href="/"><i class="fas fa-home"></i> Portal</a>
            <a href="/tracker"><i class="fas fa-chart-line"></i> Tracker</a>
            <a href="/admin" class="active"><i class="fas fa-user-shield"></i> Admin</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-tachometer-alt"></i> Loan Officer Dashboard</h1>
            <button class="refresh-btn" onclick="loadDashboard()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>

        <div class="kpi-grid" id="kpiGrid"></div>

        <div class="section">
            <h3><i class="fas fa-file-alt"></i> Recent Applications</h3>
            <table>
                <thead><tr><th>App ID</th><th>Name</th><th>Loan Amount</th><th>Income</th><th>CIBIL</th><th>Decision</th><th>Confidence</th><th>Date</th></tr></thead>
                <tbody id="applicationsTable"></tbody>
            </table>
        </div>

        <div class="section">
            <h3><i class="fas fa-wallet"></i> Active Loans</h3>
            <table>
                <thead><tr><th>Loan ID</th><th>Customer</th><th>Amount</th><th>EMI</th><th>Paid</th><th>Remaining</th><th>Bounces</th><th>Status</th></tr></thead>
                <tbody id="loansTable"></tbody>
            </table>
        </div>
    </div>

    <script>
    async function loadDashboard() {
        // Load applications summary
        const summaryRes = await fetch('/api/dashboard/summary');
        const summary = await summaryRes.json();

        // Load loans
        const loansRes = await fetch('/api/loans');
        const loansData = await loansRes.json();

        // KPIs
        document.getElementById('kpiGrid').innerHTML = `
            <div class="kpi blue"><div class="label">Total Applications</div><div class="value">${summary.total_applications}</div></div>
            <div class="kpi green"><div class="label">Approved</div><div class="value">${summary.approved}</div></div>
            <div class="kpi red"><div class="label">Rejected</div><div class="value">${summary.rejected}</div></div>
            <div class="kpi orange"><div class="label">Under Review</div><div class="value">${summary.manual_review}</div></div>
            <div class="kpi purple"><div class="label">Active Loans</div><div class="value">${loansData.total}</div></div>
        `;

        // Applications table
        const appTbody = document.getElementById('applicationsTable');
        appTbody.innerHTML = '';
        // Load from local decisions
        try {
            const decisions = await loadDecisions();
            decisions.forEach(d => {
                const badgeCls = d.decision === 'APPROVED' ? 'approved' : d.decision === 'REJECTED' ? 'rejected' : 'review';
                appTbody.innerHTML += `<tr>
                    <td><strong>${d.application_id || '—'}</strong></td>
                    <td>${d.customer_name || '—'}</td>
                    <td>₹${(d.loan_amount || 0).toLocaleString()}</td>
                    <td>₹${(d.income || 0).toLocaleString()}</td>
                    <td>${d.cibil_score || '—'}</td>
                    <td><span class="badge ${badgeCls}">${d.decision}</span></td>
                    <td>${d.confidence || '—'}%</td>
                    <td>${d.date || '—'}</td>
                </tr>`;
            });
        } catch(e) {}

        // Loans table
        const loansTbody = document.getElementById('loansTable');
        loansTbody.innerHTML = '';
        (loansData.loans || []).forEach(l => {
            const badgeCls = l.status === 'ACTIVE' ? 'active' : 'closed';
            loansTbody.innerHTML += `<tr>
                <td><strong><a href="/tracker" style="color:#1a56db;text-decoration:none;">${l.loan_id}</a></strong></td>
                <td>${l.customer_name || '—'}</td>
                <td>₹${l.loan_amount.toLocaleString()}</td>
                <td>₹${l.emi_amount.toLocaleString()}</td>
                <td>${l.emis_paid}</td>
                <td>${l.emis_remaining}</td>
                <td style="color:${l.bounces > 0 ? '#dc2626' : '#059669'}">${l.bounces}</td>
                <td><span class="badge ${badgeCls}">${l.status}</span></td>
            </tr>`;
        });
    }

    async function loadDecisions() {
        // Fetch all decision files from summary endpoint
        const res = await fetch('/api/dashboard/summary');
        const data = await res.json();
        return data.recent || [];
    }

    loadDashboard();
    </script>
</body>
</html>
